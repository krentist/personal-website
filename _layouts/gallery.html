---
layout: default
---

<article class="photo-feed-container">
  <div class="photo-feed">
    {% for photo in site.data.photos.photos %}
      <div class="photo-item" data-photo-index="{{ forloop.index }}">
        <div class="photo-image-wrapper">
          <img 
            src="/assets/gallery/{{ photo.folder }}/{{ photo.filename }}" 
            alt="Photo from {{ photo.place }}" 
            loading="lazy" 
            decoding="async"
            class="photo-image"
          />
          <div class="photo-hover-panel">
            <div class="photo-info-content">
              <div class="photo-place">{{ photo.place }}</div>
              <div class="photo-date">{{ photo.date }}</div>
            </div>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
</article>
