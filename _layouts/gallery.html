---
layout: default
---

<main>
  <div class="cameras-grid">
    {% for album in site.data.gallery.albums %}
      <a href="/albums/{{ album.title | slugify }}/" class="camera-card">
        <div class="camera-card-image">
          <img 
            src="/assets/gallery/{{ album.folder }}/{{ album.cover }}" 
            alt="{{ album.title }}" 
            loading="lazy"
            decoding="async"
            {% if album.portrait %}class="portrait"{% endif %}
          />
        </div>
        <div class="camera-card-info">
          <h3>{{ album.title }}</h3>
        </div>
      </a>
    {% endfor %}
  </div>
</main>
