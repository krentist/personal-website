name: Ingest photo albums

# Runs when photo folders are uploaded to _incoming/ (e.g. via github.com
# "Add file > Upload files" from a phone). Converts them to webp, updates the
# gallery data, and commits the result — Netlify then deploys as usual.
on:
  push:
    branches: [main]
    paths: ['_incoming/**']

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pillow pillow-heif pyyaml

      - name: Configure git
        run: |
          git config user.name "album-ingest-bot"
          git config user.email "actions@github.com"

      - name: Ingest albums
        run: python3 scripts/add_album.py --ci
