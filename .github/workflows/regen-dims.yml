name: Regenerate photo dimensions

# Keeps _data/photo_dims.yml in sync when gallery photos or data change from
# the browser (/admin edits, github.com uploads) or any other route.
# Only photo_dims.yml is committed here, and that path doesn't retrigger this
# workflow, so no loop is possible.
on:
  push:
    branches: [main]
    paths:
      - 'assets/gallery/**'
      - '_data/gallery.yml'

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pillow pyyaml

      - name: Regenerate dims and validate gallery.yml
        run: python3 scripts/regen_dims.py

      - name: Commit if changed
        run: |
          git config user.name "album-ingest-bot"
          git config user.email "actions@github.com"
          git add _data/photo_dims.yml
          git diff --cached --quiet || (git commit -m "Regenerate photo_dims.yml" && git push)
