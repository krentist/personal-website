# how the globe's expedition track links your cities:
#   journey      - chronological, inferred from each album's first photo number
#   alphabetical - by album title
#   file         - the order albums appear in this file
#   nearest      - shortest-hop chain between cities
route_order: journey

# Optional manual override for the globe's voyage line: uncomment `route:` and
# list album slugs in visit order. Slugs left off get a pin but no track.
# When absent, route_order above decides automatically (new albums join on
# their own): journey (camera-number chronology) | alphabetical | file | nearest
# route:
# - san-francisco
# - new-york

